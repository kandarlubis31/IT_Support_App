<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - IT Support</title>
    
    <link rel="stylesheet" href="/static/admin.css">
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="icon" href="/favicon.ico">
</head>
<body class="admin-login-page">
    
    <div class="login-wrapper">
        <div class="admin-login-container">
            <div class="admin-login-header">
                <div class="login-icon">
                    <i class="fas fa-user-shield"></i>
                </div>
                <h1>Admin Portal</h1>
                <p>IT Support Knowledge Base System</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    <div class="login-alerts">
                        {% for category, message in messages %}
                            <div class="alert alert-{{ 'danger' if category == 'error' else 'success' }}">
                                <i class="fas fa-{{ 'exclamation-triangle' if category == 'error' else 'check-circle' }}"></i>
                                <span>{{ message }}</span>
                            </div>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('admin_login') }}">
                <div class="form-group">
                    <label for="username">Username</label>
                    <div class="input-with-icon">
                        <i class="fas fa-user"></i>
                        <input type="text" id="username" name="username" placeholder="Masukkan username" required autocomplete="username" autofocus>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-with-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" name="password" placeholder="Masukkan password" required autocomplete="current-password">
                    </div>
                </div>

                <button type="submit" class="btn-login-full">
                    <i class="fas fa-sign-in-alt"></i> Masuk Dashboard
                </button>
            </form>

            <div class="admin-login-footer">
                <a href="{{ url_for('index') }}">
                    <i class="fas fa-arrow-left"></i> Kembali ke Halaman Utama
                </a>
            </div>
        </div>
        
        <p class="copyright">© 2025 IT Support System. All Rights Reserved.</p>
    </div>

    <script>
        // Pastikan tema ter-set (mencegah glitch tampilan)
        document.addEventListener('DOMContentLoaded', () => {
            localStorage.setItem('theme', 'light'); // Login page dipaksa light/clean look
            document.body.setAttribute('data-theme', 'light');
        });
    </script>
</body>
</html>
